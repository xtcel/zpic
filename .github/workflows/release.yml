name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag matches Cargo version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow must run from a tag ref, got ${GITHUB_REF_TYPE}." >&2
            exit 1
          fi

          version="$(cargo pkgid -p zpic | sed 's/.*#.*@//')"
          tag="${GITHUB_REF_NAME}"

          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match Cargo package version v${version}." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Run test suite
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: zpic
            archive_ext: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            binary: zpic
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: zpic
            archive_ext: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: zpic.exe
            archive_ext: zip
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p zpic --bin zpic

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          stem="zpic-v${VERSION}-${{ matrix.target }}"
          stage="dist/stage/${stem}"
          archive="dist/${stem}.${{ matrix.archive_ext }}"

          mkdir -p "${stage}" dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${stage}/zpic"
          cp README.md LICENSE "${stage}/"

          tar -C "dist/stage" -czf "${archive}" "${stem}"
          (cd dist && shasum -a 256 "$(basename "${archive}")" | tee "$(basename "${archive}").sha256")

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stem = "zpic-v${env:VERSION}-${{ matrix.target }}"
          $stage = "dist/stage/$stem"
          $archive = "dist/$stem.${{ matrix.archive_ext }}"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/zpic.exe"
          Copy-Item README.md, LICENSE $stage

          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $archive -Leaf)" | Out-File -FilePath "$archive.sha256" -Encoding ascii

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail

          archive="release-artifacts/zpic-v${VERSION}-source.tar.gz"
          git archive --format=tar.gz --prefix="zpic-v${VERSION}/" HEAD > "${archive}"
          (cd release-artifacts && shasum -a 256 "$(basename "${archive}")" | tee "$(basename "${archive}").sha256")

      - name: Build checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cat release-artifacts/*.sha256 | sort > release-artifacts/checksums.txt

      - name: Render Homebrew formula
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(
            awk '$2 == "zpic-v'"${VERSION}"'-source.tar.gz" { print $1 }' release-artifacts/checksums.txt
          )"

          if [[ -z "${source_sha}" ]]; then
            echo "Failed to find source archive checksum." >&2
            exit 1
          fi

          ./scripts/render-homebrew-formula.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --version "${VERSION}" \
            --source-sha "${source_sha}" \
            --output release-artifacts/zpic.rb

      - name: Publish or update GitHub release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-artifacts/* --clobber
          else
            gh release create "${TAG}" \
              release-artifacts/* \
              --title "${TAG}" \
              --notes "Automated release for ${TAG}. Includes prebuilt binaries, a source tarball, checksums, and a Homebrew formula."
          fi
