[workspace]
resolver = "2"
members = [
    "crates/zpic-core",
    "crates/zpic-config",
    "crates/zpic-media",
    "crates/zpic-history",
    "crates/zpic-plugins",
    "crates/zpic-uploaders",
    "crates/zpic-cli",
]
exclude = ["extensions/zed"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xtcel/zpic"
homepage = "https://github.com/xtcel/zpic"
authors = ["xtcel"]

[workspace.dependencies]
zpic-core = { version = "0.2.0", path = "crates/zpic-core" }
zpic-config = { version = "0.2.0", path = "crates/zpic-config" }
zpic-media = { version = "0.2.0", path = "crates/zpic-media" }
zpic-history = { version = "0.2.0", path = "crates/zpic-history" }
zpic-plugins = { version = "0.2.0", path = "crates/zpic-plugins" }
zpic-uploaders = { version = "0.2.0", path = "crates/zpic-uploaders" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# CLI / arg parsing
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors
thiserror = "1"
anyhow = "1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "multipart", "tokio", "tracing"] }
tower = { version = "0.5", default-features = false, features = ["timeout", "util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "trace", "timeout"] }
hyper = { version = "1", features = ["server"] }
mime = "0.3"

# Filesystem / paths
directories = "5"
walkdir = "2"
tempfile = "3"

# Bytes
bytes = "1"

# Hashing
blake3 = "1"
hex = "0.4"
hmac = "0.12"

# Image / mime
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp", "bmp"] }
infer = "0.16"

# IDs / time
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Clipboard
arboard = "3"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Base64
base64 = "0.22"

# URL utilities
url = "2"

# Network interface enumeration (LAN URL discovery for the HTTP server)
if-addrs = "0.15"

# WASM runtime
wasmtime = { version = "29.0.1", default-features = false, features = ["cranelift", "runtime", "wat"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
