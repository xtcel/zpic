[package]
name = "zpic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Rust-native image hosting CLI compatible with PicGo configuration."

[lib]
name = "zpic_cli"
path = "src/lib.rs"

[[bin]]
name = "zpic"
path = "src/main.rs"

[dependencies]
zpic-core = { workspace = true }
zpic-config = { workspace = true }
zpic-image = { workspace = true }
zpic-history = { workspace = true }
zpic-uploaders = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
arboard = { workspace = true }
walkdir = { workspace = true }
directories = { workspace = true }
bytes = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }
pulldown-cmark = "0.12"
glob = "0.3"
regex = "1"
tempfile = { workspace = true }
cliclack = "0.5"
