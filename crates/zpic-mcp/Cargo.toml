[package]
name = "zpic-mcp"
description = "MCP (Model Context Protocol) server exposing zpic uploads to AI agents"
version.workspace = true
edition.workspace = true
# rmcp pulls in edition-2024 dependencies; this crate's own MSRV tracks
# that even though the rest of the workspace stays on 1.75.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "zpic-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1.0"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
toml.workspace = true
