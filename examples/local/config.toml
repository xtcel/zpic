default_format = "markdown"
copy_after_upload = false
history_enabled = true

[rename]
strategy = "date-hash"
path = "images/{yyyy}/{mm}/{dd}/{hash8}.{ext}"

[format]
markdown = "![{alt}]({url})"

[pic_bed]
current = "local"
uploader = "local"

[pic_bed.local]
target_dir = "./public/images"
public_base_url = "/images"

[uploader.local]
defaultId = "cfg-default"
configList = [
  { _id = "cfg-default", _configName = "Default", _createdAt = 0, _updatedAt = 0, target_dir = "./public/images", public_base_url = "/images" },
]
